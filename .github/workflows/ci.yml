on: push
name: CI

jobs:
  validate-json:
    name: Validate JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JSON syntax
        run: |
          python3 .github/scripts/validate_json.py

  lint:
    name: C# formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: dotnet format
        run: dotnet format whitespace --verify-no-changes source/CustomFilters.csproj

  audit:
    name: NuGet vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Check for vulnerable packages
        # Restore may fail if game DLLs are absent; continue-on-error surfaces
        # findings without blocking CI (Dependabot also covers this).
        continue-on-error: true
        run: dotnet list source/CustomFilters.csproj package --vulnerable --include-transitive

  build:
    uses: BattletechModders/ModTek/.github/workflows/mod-builder.yml@master
    with:
      checkout-directory: 'BATTLETECH/Mods/CustomFilters'
      build-script: |
        (
          cd ..
          curl -L -o CustomComponents.zip https://github.com/BattletechModders/CustomComponents/releases/download/latest/CustomComponents.zip
          unzip CustomComponents.zip
        )
        (
          cd source
          dotnet build --configuration Release -p:BattleTechGameDir="$BATTLETECH_DIR/"
        )
        (
          cd ..
          7z a -tzip -mx9 "$DIST_DIR/CustomFilters.zip" \
            -ir!CustomFilters \
            -xr!source "-xr!.*"
        )
      release-notes: |
        Requires ModTek to be up-to-date.
        CustomFilters.zip contains the mod.
    secrets: inherit
