on: push
name: CI

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON files
        run: python .github/scripts/validate_json.py

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8
      - name: Check whitespace formatting
        run: |
          dotnet format whitespace --verify-no-changes source/CustomFilters.csproj
          dotnet format whitespace --verify-no-changes source/CustomFilters.Tests/CustomFilters.Tests.csproj

  nuget-vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8
      - name: Restore test project packages
        run: dotnet restore source/CustomFilters.Tests/CustomFilters.Tests.csproj
      - name: NuGet vulnerability scan
        run: |
          dotnet list source/CustomFilters.Tests/CustomFilters.Tests.csproj package --vulnerable --include-transitive \
            2>&1 | tee /tmp/vuln.txt
          ! grep -q "has the following vulnerable" /tmp/vuln.txt

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8
      - name: Run unit tests with coverage
        run: |
          dotnet test source/CustomFilters.Tests/CustomFilters.Tests.csproj --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory coverage/
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/**/coverage.cobertura.xml
          if-no-files-found: warn

  build:
    uses: BattletechModders/ModTek/.github/workflows/mod-builder.yml@master
    with:
      checkout-directory: 'BATTLETECH/Mods/CustomFilters'
      build-script: |
        (
          cd ..
          curl -L -o CustomComponents.zip https://github.com/BattletechModders/CustomComponents/releases/download/latest/CustomComponents.zip
          unzip CustomComponents.zip
        )
        (
          cd source
          dotnet build --configuration Release -p:BattleTechGameDir="$BATTLETECH_DIR/"
        )
        (
          cd ..
          7z a -tzip -mx9 "$DIST_DIR/CustomFilters.zip" \
            -ir!CustomFilters \
            -xr!source "-xr!.*"
        )
      release-notes: |
        Requires ModTek to be up-to-date.
        CustomFilters.zip contains the mod.
    secrets: inherit
